[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json_log
    Reserve_Data  On

[OUTPUT]
    Name              http
    Match             *
    Host              api
    Port              8000
    URI               /ingest
    Format            json
    Header            Content-Type application/json
    allow_duplicated_headers false
